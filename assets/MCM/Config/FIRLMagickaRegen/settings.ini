; DEFAULT values shipped with the mod.
; Settings changed in the MCM are written by MCM Helper to
; Data/MCM/Settings/FIRLMagickaRegen.ini (which overrides this file).

[General]
bEnabled=1
bPlayer=1
bNPCs=1

[Formula]
; Regeneration per second = max magicka x fPercent / 100 + fFlat
; (then x regeneration bonuses: enchantments, potions...)
fPercent=3.0
fFlat=5.0
bMultAffectsFlat=1
; 1 = no regeneration during the vanilla delay that follows spending magicka
bRespectDelay=0
